<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader No Watermark</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Background Gambar dengan Overlay Gelap & Animasi Pulse */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(15, 23, 42, 0.85)), url('https://i.ibb.co.com/xK5B4jL2/vidma-recorder-10092026-073539.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Glassmorphism disesuaikan tema Gelap & Merah/Biru Glow */
        .container {
            background: rgba(15, 23, 42, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.15);
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- ANIMASI GLITCH PADA JUDUL --- */
        .glitch-title {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #f87171;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 12px rgba(248, 113, 113, 0.6);
        }

        .glitch-title::before,
        .glitch-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-title::before {
            left: 2px;
            text-shadow: -2px 0 #ef4444;
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: -2px;
            text-shadow: 2px 0 #06b6d4;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 15px, 0); }
            20% { clip: rect(55px, 9999px, 80px, 0); }
            40% { clip: rect(10px, 9999px, 85px, 0); }
            60% { clip: rect(70px, 9999px, 25px, 0); }
            80% { clip: rect(35px, 9999px, 50px, 0); }
            100% { clip: rect(5px, 9999px, 60px, 0); }
        }

        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 70px, 0); }
            20% { clip: rect(10px, 9999px, 30px, 0); }
            40% { clip: rect(80px, 9999px, 5px, 0); }
            60% { clip: rect(25px, 9999px, 90px, 0); }
            80% { clip: rect(45px, 9999px, 15px, 0); }
            100% { clip: rect(90px, 9999px, 40px, 0); }
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        button {
            padding: 12px 20px;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            background: #b91c1c;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none !important;
        }

        .loader-container {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid rgba(239, 68, 68, 0.2);
            border-top: 4px solid #ef4444;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            animation: slideUpFade 0.5s ease-out forwards;
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .img-wrapper {
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .result-box img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .img-wrapper:hover img {
            transform: scale(1.08);
        }

        .result-box h3 {
            font-size: 14px;
            margin-bottom: 15px;
            color: #cbd5e1;
            text-align: left;
            line-height: 1.4;
        }

        .dl-btn {
            display: block;
            background: #22c55e;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.2s ease, transform 0.2s ease;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
            70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .dl-btn:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .shake {
            animation: shakeInput 0.4s ease-in-out;
        }

        @keyframes shakeInput {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Tambahan atribut data-text agar efek glitch berjalan -->
        <h1 class="glitch-title" data-text="TikTok Downloader">TikTok Downloader</h1>
        <p>Download video TikTok tanpa watermark gratis</p>

        <div class="input-box" id="inputGroup">
            <input type="text" id="tiktokUrl" placeholder="Tempel link TikTok di sini...">
            <button id="downloadBtn" onclick="downloadVideo()">Unduh</button>
        </div>

        <div id="loading" class="loader-container hidden">
            <div class="spinner"></div>
            <span style="font-size: 13px; color: #f87171;">Sedang memproses video...</span>
        </div>

        <div id="result" class="result-box hidden">
            <div class="img-wrapper">
                <img id="videoCover" src="" alt="Thumbnail Video">
            </div>
            <h3 id="videoTitle">Judul Video</h3>
            <a id="downloadLink" href="#" target="_blank" class="dl-btn">Download Video (No WM)</a>
        </div>
    </div>

    <script>
        async function downloadVideo() {
            const urlInput = document.getElementById('tiktokUrl');
            const inputGroup = document.getElementById('inputGroup');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const videoCover = document.getElementById('videoCover');
            const videoTitle = document.getElementById('videoTitle');
            const downloadLink = document.getElementById('downloadLink');

            const val = urlInput.value.trim();

            if (!val) {
                inputGroup.classList.remove('shake');
                void inputGroup.offsetWidth;
                inputGroup.classList.add('shake');
                return;
            }

            loading.classList.remove('hidden');
            result.classList.add('hidden');

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(val)}`);
                const data = await response.json();

                if (data.code === 0) {
                    const videoData = data.data;

                    videoCover.src = videoData.cover;
                    videoTitle.innerText = videoData.title || "Video TikTok";
                    downloadLink.href = videoData.play;

                    loading.classList.add('hidden');
                    
                    result.classList.remove('hidden');
                    result.style.animation = 'none';
                    void result.offsetWidth; 
                    result.style.animation = null;
                } else {
                    alert("Gagal mengambil video. Pastikan link benar dan akun tidak privat.");
                    loading.classList.add('hidden');
                }
            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan saat memproses request.");
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
